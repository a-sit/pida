# Fuzz-Ziele für pida-pdf-cos (cargo-fuzz/libFuzzer). Eigener Workspace: braucht eine Nightly-Toolchain und
# gehört nicht zum normalen Build (im Wurzel-Workspace unter `exclude`). Aufruf: tools/fuzz-pdf-cos.sh,
# Beschreibung: docs/entwicklung.md („Fuzzing“).
[package]
name = "pida-pdf-cos-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "EUPL-1.2"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
pida-pdf-cos = { path = ".." }

[[bin]]
name = "open"
path = "fuzz_targets/open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xmp"
path = "fuzz_targets/xmp.rs"
test = false
doc = false
bench = false

[workspace]
