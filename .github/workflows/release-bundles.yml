# Release-Bundles für Windows, Linux und macOS – manuell auslösbar.
#
# Baut die optimierten Installer mit PDFium und Drittlizenz-Hinweisen (Plan §9.1; für Windows im Job
# notices-windows erzeugt) und legt sie als Artefakte ab. Code-Signierung mit Identität, Notarisierung und Updater fehlen noch (Signier-Identitäten
# beim Auftraggeber, Plan E-13); die Bundles sind zum Testen gedacht. macOS: PIDA.app ist ad hoc signiert
# (versiegelte Ressourcen, `codesign --verify --deep --strict` wird geprüft), aber nicht notarisiert.
name: Release-Bundles

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-bundles-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_TOOLCHAIN: "1.99.0"
  NODE_VERSION: "22"
  CARGO_ABOUT_VERSION: "0.9.2"

jobs:
  # Drittlizenz-Hinweise für die Windows-Pakete: tools/third-party-notices.sh läuft nur unter Linux/macOS (bash,
  # python3, cargo-about); mit --pdfium win-x64 enthalten sie die PDFium-Lizenzen des Windows-Pakets und den
  # Windows-Teil (WebView2-SDK, NSIS, WiX/MS-RL; Lizenzbericht Befund 1). Der Windows-Bundle-Job lädt sie als Artefakt.
  notices-windows:
    name: THIRD-PARTY-NOTICES (Windows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust-Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-about@${{ env.CARGO_ABOUT_VERSION }}
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/app/package-lock.json
      - name: npm ci (Lizenztexte)
        working-directory: apps/app
        run: npm ci --ignore-scripts
      - name: Hinweise erzeugen (PDFium win-x64, Windows-Teil)
        run: tools/third-party-notices.sh --pdfium win-x64 --out target/notices
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notices-windows
          path: target/notices/
          if-no-files-found: error

  bundle:
    name: Release-Bundle (${{ matrix.os }})
    needs: notices-windows
    # Linux und macOS auch bauen, wenn notices-windows fehlschlägt (needs gilt für die ganze Matrix); Windows bricht
    # dann im ersten Schritt ab
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb,rpm
            notices: true
          - os: windows-latest
            bundles: nsis,msi
            notices: true
          - os: macos-latest
            bundles: app,dmg
            notices: true
    defaults:
      run:
        shell: bash
    steps:
      - name: Hinweise vorhanden? (Windows)
        if: runner.os == 'Windows' && needs.notices-windows.result != 'success'
        run: |
          echo "::error::Job notices-windows ist fehlgeschlagen – Windows-Pakete brauchen die Drittlizenz-Hinweise"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Plattenplatz freigeben (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Rust-Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-bundle
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: PDFium-Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/pdfium
          key: pdfium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/pdfium.lock') }}
      - name: PDFium laden (macOS/Linux)
        if: runner.os != 'Windows'
        run: tools/fetch-pdfium.sh --github-env
      - name: PDFium laden (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/fetch-pdfium.ps1 -GitHubEnv
      - name: Tauri-Systembibliotheken und Xvfb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev \
            patchelf rpm xvfb
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/app/package-lock.json
      - name: npm ci
        working-directory: apps/app
        run: npm ci
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        if: matrix.notices && runner.os != 'Windows'
        with:
          tool: cargo-about@${{ env.CARGO_ABOUT_VERSION }}
      - name: Drittlizenz-Hinweise (ins Bundle)
        if: matrix.notices && runner.os != 'Windows'
        run: tools/third-party-notices.sh --out target/notices
      - name: Drittlizenz-Hinweise (Windows, aus dem Job notices-windows)
        if: matrix.notices && runner.os == 'Windows'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices-windows
          path: target/notices
      # Lizenzgrundlage der statisch gelinkten MSVC-Laufzeit festhalten (Backlog Nr. 8): Visual-Studio-Version und
      # MSVC-Toolsets des Runners, mit denen pida.exe gelinkt wird
      - name: MSVC-Version (Windows)
        if: runner.os == 'Windows'
        # nur Protokoll – darf das Release nicht aufhalten
        continue-on-error: true
        run: |
          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          vs="$("$vswhere" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)"
          {
            echo "### MSVC-Laufzeit (statisch gelinkt)"
            echo '```'
            "$vswhere" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property displayName
            "$vswhere" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
            ls "$(cygpath -u "$vs")/VC/Tools/MSVC" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Release-Bundle (${{ matrix.bundles }}) mit PDFium
        working-directory: apps/app
        env:
          REQUIRE: ${{ matrix.notices && '--require-notices' || '' }}
          # die App bettet die Hinweise für „Lizenzen anzeigen“ ein (pida-cli, Feature notices): ohne Hinweise abbrechen
          PIDA_REQUIRE_NOTICES: ${{ matrix.notices && '1' || '' }}
          # macOS: DMG ohne Finder-Automation (AppleScript-Layout überspringen)
          CI: "true"
        run: |
          # shellcheck disable=SC2086 # REQUIRE ist leer oder genau ein Schalter
          node scripts/bundle-config.mjs --require-pdfium $REQUIRE --out src-tauri/bundle.conf.json
          npm run tauri -- build --bundles ${{ matrix.bundles }} --config src-tauri/bundle.conf.json
      # Portables Linux-Paket (Backlog Nr. 31): AppImage aus demselben Build und mit derselben Konfiguration (PDFium,
      # Hinweise, LICENSE). Vorerst ein Versuch, der deb und rpm nicht aufhält; linuxdeploy ohne FUSE auf dem Runner.
      - name: AppImage (Linux, portabel)
        if: runner.os == 'Linux'
        continue-on-error: true
        working-directory: apps/app
        env:
          CI: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri -- build --bundles appimage --config src-tauri/bundle.conf.json
      # Tauri signiert PIDA.app samt Frameworks (libpdfium.dylib) vor dem DMG-Bau ad hoc
      # (bundle.macOS.signingIdentity "-"). Nur vom Linker signiert („Sealed Resources=none“) meldete macOS
      # die heruntergeladene App als „beschädigt“ (0.2.0); geprüft werden die App und die App in der DMG.
      - name: Codesignatur prüfen (macOS, codesign --verify --deep --strict)
        if: runner.os == 'macOS'
        run: tools/verify-macos-bundle.sh target/release/bundle
      - name: Größe
        run: |
          {
            echo "### Release-Bundle ${{ matrix.os }} (${{ matrix.bundles }})"
            echo '```'
            du -sh target/release/bundle/*/* 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Startprüfung (Kern + WebView, PIDA_SMOKE=1)
        continue-on-error: ${{ runner.os != 'macOS' }}
        timeout-minutes: 3
        env:
          PIDA_SMOKE: "1"
        run: |
          home="$(mktemp -d)"
          case "$RUNNER_OS" in
            Linux) HOME="$home" xvfb-run -a target/release/pida ;;
            macOS) HOME="$home" "target/release/bundle/macos/PIDA.app/Contents/MacOS/pida" ;;
            Windows) APPDATA="$home" LOCALAPPDATA="$home" target/release/pida.exe ;;
          esac | tee smoke.txt
          # pdfium=true: die Bibliothek aus dem Bundle ist geladen (ad hoc mit Hardened Runtime lehnte macOS sie ab)
          grep -q '^pida-smoke: ok .*pdfium=true' smoke.txt
      # Portables Windows-Paket (Backlog Nr. 31): pida.exe mit pdfium.dll, Lizenztexten und dem Ordner „PIDA-Daten“,
      # der den portablen Modus einschaltet (Einstellungen, Logs, WebView-Daten darin; Passwörter nur bis zum Beenden).
      # Die WebView2-Laufzeit bleibt Voraussetzung (in Windows 10/11 enthalten).
      - name: Portables ZIP (Windows)
        if: runner.os == 'Windows'
        run: |
          version="$(node -p "require('./apps/app/src-tauri/tauri.conf.json').version")"
          dir="target/release/bundle/portable/PIDA"
          rm -rf target/release/bundle/portable && mkdir -p "$dir/PIDA-Daten"
          cp target/release/pida.exe "$(cygpath -u "$PIDA_PDFIUM_DIR")/pdfium.dll" "$dir/"
          cp LICENSE "$dir/LICENSE.txt"
          cp target/notices/THIRD-PARTY-NOTICES.md target/notices/RUST-STD-COPYRIGHT.html "$dir/"
          printf '%s\r\n' \
            'PIDA (portabel): Einstellungen, Protokolle und Daten der Oberfläche liegen in diesem Ordner.' \
            'Passwörter werden nur bis zum Beenden gemerkt, nie im Windows-Anmeldeinformationsspeicher.' \
            'Ordner löschen oder umbenennen = PIDA nutzt wieder das Benutzerprofil.' \
            '' \
            'PIDA (portable): settings, logs and UI data are stored in this folder.' \
            'Passwords are kept only until PIDA quits, never in the Windows Credential Manager.' \
            'Delete or rename this folder and PIDA uses the user profile again.' >"$dir/PIDA-Daten/LIESMICH.txt"
          (cd target/release/bundle/portable && 7z a -tzip -mx=9 "PIDA_${version}_x64-portable.zip" PIDA >/dev/null)
          ls -l target/release/bundle/portable
      - name: Startprüfung portabel (Windows, Daten im Ordner)
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 3
        env:
          PIDA_SMOKE: "1"
        run: |
          home="$(mktemp -d)"
          dir="target/release/bundle/portable/PIDA"
          APPDATA="$home" LOCALAPPDATA="$home" "$dir/pida.exe" | tee smoke-portable.txt
          grep -q '^pida-smoke: ok .*pdfium=true' smoke-portable.txt
          find "$dir/PIDA-Daten" -maxdepth 2 | head -40
          test -d "$dir/PIDA-Daten/logs"
          # nichts im (umgelenkten) Benutzerprofil außer Laufzeitresten von Windows
          find "$home" -maxdepth 3 | head -20
          ! find "$home" -maxdepth 3 -iname '*pida*' | grep -q .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pida-release-${{ matrix.os }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/portable/*.zip
            target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # Web-Variante (Konzept Webdienst): Server samt Oberfläche als Linux-Pakete – .deb (Debian/Ubuntu), .rpm
  # (RHEL/Alma/Rocky/Fedora/openSUSE) und .tar.gz (übrige, mit install.sh/uninstall.sh). Das Programm ist statisch
  # gebaut (musl, keine C-Abhängigkeiten) und läuft damit auf jeder x86_64-Distribution. Geprüft wird in frischen
  # Containern (debian:12, rockylinux:9): Installation, Update auf eine neuere Version (Einstellung bleibt),
  # Deinstallation – apps/web-server/packaging/test-install.sh.
  web-linux:
    name: Web-Variante (Linux-Pakete)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust-Toolchain (WebAssembly, musl)
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown,x86_64-unknown-linux-musl
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: web-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: PDFium-Cache (WebAssembly)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/pdfium
          key: pdfium-wasm-${{ hashFiles('tools/pdfium.lock') }}
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/app/package-lock.json
      - name: npm ci
        working-directory: apps/app
        run: npm ci
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-about@${{ env.CARGO_ABOUT_VERSION }}
      - name: wasm-bindgen-cli 0.2.129 (passend zu wasm-bindgen in Cargo.lock)
        run: cargo install --locked wasm-bindgen-cli --version 0.2.129 --root target/wasm-tools
      - name: rpmbuild
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rpm
      - name: Drittlizenz-Hinweise (Browser und Server, PDFium WebAssembly)
        run: tools/third-party-notices.sh --web --pdfium wasm --out target/notices-web
      - name: Oberfläche und Kern als WebAssembly
        env:
          PIDA_WEB_NOTICES: target/notices-web
        run: |
          apps/web/build.sh
          test ! -e apps/web/dist/samples
      - name: Server statisch (musl)
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: |
          cargo build --locked --release -p pida-web-server --target x86_64-unknown-linux-musl
          file target/x86_64-unknown-linux-musl/release/pida-web-server | tee /dev/stderr | grep -q 'static'
      - name: Pakete (deb, rpm, tar.gz) und Folgeversion für den Update-Test
        run: |
          bin=target/x86_64-unknown-linux-musl/release/pida-web-server
          apps/web-server/packaging/package.sh --binary "$bin" --dist apps/web/dist --notices target/notices-web \
            --out target/web-packages
          version="$("$bin" --version | awk '{print $2}')"
          PIDA_WEB_PKG_VERSION="$version+test1" apps/web-server/packaging/package.sh --binary "$bin" \
            --dist apps/web/dist --notices target/notices-web --out target/web-packages-next
          {
            echo "### Web-Variante (Linux-Pakete)"
            echo '```'
            ls -l target/web-packages
            cat target/web-packages/SHA256SUMS-web
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Installationstest .deb (debian:12)
        run: |
          docker run --rm -v "$PWD:/w" -w /w debian:12 bash apps/web-server/packaging/test-install.sh deb \
            target/web-packages/*.deb target/web-packages-next/*.deb
      - name: Installationstest .rpm (rockylinux:9)
        run: |
          docker run --rm -v "$PWD:/w" -w /w rockylinux:9 bash apps/web-server/packaging/test-install.sh rpm \
            target/web-packages/*.rpm target/web-packages-next/*.rpm
      - name: Installationstest .tar.gz (debian:12)
        run: |
          docker run --rm -v "$PWD:/w" -w /w debian:12 bash apps/web-server/packaging/test-install.sh tar \
            target/web-packages/*.tar.gz target/web-packages-next/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pida-web-linux
          path: |
            target/web-packages/*.deb
            target/web-packages/*.rpm
            target/web-packages/*.tar.gz
            target/web-packages/SHA256SUMS-web
          if-no-files-found: error
